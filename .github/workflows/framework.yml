name: Framework checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/verify_sources.py
      - run: python -m pip install numpy
      - run: python -m unittest discover -s tests -v
      - run: python tools/run_framework_demo.py
  controlled-dxf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy ezdxf
      - run: python -m unittest discover -s tests -v
  case-084-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install cadquery ezdxf numpy
      - run: python tools/verify_sources.py
      - run: python tools/verify_case84_geometry.py
      - run: python -m unittest discover -s tests -p test_projection.py -v
      - run: python tools/build_projection_demo.py
