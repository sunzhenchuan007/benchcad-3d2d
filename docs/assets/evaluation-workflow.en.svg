  <g class="label">
    <text x="360" y="73">Input: STEP part</text>
    <text x="310" y="266">Evaluated AI</text>
    <text x="1864" y="223" style="font-size:21px"><tspan x="1864">Human annotation</tspan><tspan x="1864" dy="29">Select target axes</tspan><tspan x="1864" dy="29">Mark section positions</tspan></text>
    <text x="273" y="432"><tspan x="273">Output: DXF</tspan><tspan x="273" dy="29">engineering drawing</tspan></text>
    <text x="1450" y="432"><tspan x="1450">Output: section-description</tspan><tspan x="1450" dy="29">JSON</tspan></text>
    <text x="1864" y="447">Export: GT section JSON</text>
    <text x="195" y="640"><tspan x="195">Independent 2D → 3D AI</tspan><tspan x="195" dy="29">Reads DXF only</tspan></text>
    <text x="812" y="633"><tspan x="812">Script or AI checks collisions</tspan><tspan x="812" dy="29">Dimensions, text, leaders</tspan></text>
    <text x="1237" y="640"><tspan x="1237">Read section lines</tspan><tspan x="1237" dy="29">actually drawn in DXF</tspan></text>
    <text x="195" y="820"><tspan x="195">Reconstructed</tspan><tspan x="195" dy="29">STEP</tspan></text>
    <text x="481" y="840">GT STEP</text>
