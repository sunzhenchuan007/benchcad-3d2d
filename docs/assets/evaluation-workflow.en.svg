<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1234" viewBox="0 0 2048 1234" role="img" aria-labelledby="title desc">
  <title id="title">BenchCAD 3D2D proposed evaluation workflow</title>
  <desc id="desc">A STEP part goes to the evaluated AI and a human section-annotation workbench. The AI outputs DXF and section JSON. Independent reconstruction uses only DXF and produces STEP for volumetric IoU against GT STEP. DXF annotations are checked for collisions. Actual DXF section lines, submitted JSON, and human GT JSON are used to check section positions against specified axes. Full scoring integration is pending.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1 L7 5 L2 9" fill="none" stroke="#93989e" stroke-width="1.8"/></marker>
    <style>
      .box {fill:#f3f3f3;stroke:#dedede;stroke-width:2}
      .link {fill:none;stroke:#93989e;stroke-width:1.8;marker-end:url(#arrow)}
      .label {font-family:Arial,Helvetica,sans-serif;font-size:23px;font-weight:600;fill:#454545;text-anchor:middle}
    </style>
  </defs>
