    <text x="244" y="1009">Compare with GT STEP</text>
    <text x="1450" y="994"><tspan x="1450">Score 3:</tspan><tspan x="1450" dy="29">section-position penalties</tspan></text>
    <text x="244" y="1178">Score 1: volumetric IoU</text>
