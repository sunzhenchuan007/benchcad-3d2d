<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="920" viewBox="0 0 1080 920" role="img" aria-labelledby="title desc">
<title id="title">BenchCAD 3D2D: one repository, two CAD backends</title><desc id="desc">Current workflow; local SolidWorks pilot versus planned FreeCAD backend. Expert reconstruction correction deferred.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#46617e"/></marker></defs>
<rect width="1080" height="920" fill="#f4f7fa"/>
<text x="40" y="52" font-family="Arial,Microsoft YaHei,sans-serif" font-size="26" font-weight="bold" fill="#17324f">BenchCAD 3D2D: one repository, two CAD backends</text>
<rect x="40" y="100" width="590" height="75" rx="10" fill="white" stroke="#9fb2c8"/>
<text x="58" y="130" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#17324f">STEP + task, tools and budget</text>
<text x="58" y="155" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#17324f">Drawing AI reads geometry; no private GT</text>
<rect x="40" y="220" width="590" height="75" rx="10" fill="white" stroke="#9fb2c8"/>
<text x="58" y="250" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#17324f">Drawing AI → CAD tools → preview / revise</text>
<text x="58" y="275" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#17324f">SolidWorks tested locally; FreeCAD planned</text>
<rect x="40" y="340" width="590" height="100" rx="10" fill="white" stroke="#9fb2c8"/>
<text x="58" y="370" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#17324f">Controller reopens submitted native drawing</text>
<text x="58" y="395" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#17324f">Exports final DXF, renders PNG, derives state JSON</text>
<text x="58" y="420" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#17324f">Native extractor / log-consumer integration pending</text>
<rect x="40" y="500" width="590" height="90" rx="10" fill="white" stroke="#9fb2c8"/>
<text x="58" y="530" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#17324f">Independent AI: final DXF + its PNG → STEP</text>
<text x="58" y="555" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#17324f">No source STEP, GT, native CAD or drawing logs</text>
<rect x="40" y="650" width="590" height="100" rx="10" fill="white" stroke="#9fb2c8"/>
<text x="58" y="680" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#17324f">Evaluator compares reference and reconstructed STEP</text>
<text x="58" y="705" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#17324f">Center, normalize; max over rotations and reflections</text>
<text x="58" y="730" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#17324f">Report both scores when reflection improves IoU</text>
<rect x="680" y="130" width="350" height="80" rx="10" fill="white" stroke="#9fb2c8"/>
<text x="698" y="160" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#17324f">Expert section GT</text>
<text x="698" y="185" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#17324f">Approval required before scoring</text>
<rect x="680" y="340" width="350" height="100" rx="10" fill="white" stroke="#9fb2c8"/>
<text x="698" y="370" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#17324f">Section position + DXF evidence</text>
<text x="698" y="395" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#17324f">Case 13: approved GT missing</text>
<rect x="680" y="500" width="350" height="90" rx="10" fill="white" stroke="#9fb2c8"/>
<text x="698" y="530" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#17324f">DXF collisions and view counts</text>
<text x="698" y="555" font-family="Arial,Microsoft YaHei,sans-serif" font-size="15" fill="#17324f">Complete penalties pending</text>
<path d="M335 175 V220" fill="none" stroke="#46617e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M335 295 V340" fill="none" stroke="#46617e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M335 440 V500" fill="none" stroke="#46617e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M335 590 V650" fill="none" stroke="#46617e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M855 210 V340" fill="none" stroke="#46617e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M630 390 H680" fill="none" stroke="#46617e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M630 415 H652 V545 H680" fill="none" stroke="#46617e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="825" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#17324f">Expert DXF → AI STEP baseline correction is deferred; no baseline-IoU division.</text>
<text x="40" y="857" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#17324f">This diagram describes the workflow and component status, not an overall benchmark score.</text>
</svg>
